# Baseline Configuration for KosmoHackathon 2026
# Case: Operational Hydrological Monitoring via Sentinel-1 (SAR) and Sentinel-2 (MSI)

project:
  name: "voda"
  version: "0.1.0"
  random_seed: 42

crs: "EPSG:32652"
resolution_meters: 10.0

thresholds:
  flood_tolerance_ha: 50.0
  water_tolerance_ha: 200.0
  baseline_max_fraction: 0.005  # 0.5% of AOI area
  max_raster_discrepancy_ratio: 0.02  # 2% maximum discrepancy

radar:
  vv_otsu_range_db: [-24.0, -11.0]
  delta_sigma0_drop_db: -3.0
  speckle_filter: "lee"
  speckle_window_size: 5

optics:
  mndwi_water_threshold: 0.15
  ndwi_water_threshold: 0.10
  ndvi_vegetation_threshold: 0.20
  aweish_water_threshold: 0.00

terrain:
  hand_hard_threshold_meters: 25.0
  hand_soft_center_meters: 15.0
  hand_soft_temperature_meters: 3.0
  max_slope_degrees: 5.0
  jrc_gsw_permanent_water_pct: 80.0
  min_water_body_pixels: 25  # 2500 m^2

evaluation:
  metric_weights:
    q_flood: 0.45
    q_water_peak: 0.25
    q_water_pre: 0.15
    spec_base: 0.15

paths:
  data_dir: "new tz/data"
  fallback_data_dir: "data/synthetic_benchmark"
  reports_dir: "reports"
  predictions_dir: "output/predictions"
  pairs_csv: "new tz/data/pairs.csv"
  sample_submission: "new tz/data/sample_submission.csv"
  events_catalog: "new tz/data/tables/events_catalog.csv"
  scene_catalog: "new tz/data/tables/scene_catalog.csv"
  rasters_dir: "new tz/data/rasters"
  reference_masks_dir: "new tz/data/reference_masks"
  vectors_dir: "new tz/data/vectors"

aoi_areas_ha:
  baseline_2018_09_low__blagoveshchensk: 164916.78
  baseline_2018_09_low__konstantinovka: 123544.96
  baseline_2018_09_low__svobodny: 132896.50
  flood_2019_07_amur__belogorsk: 91385.13
  flood_2019_07_amur__blagoveshchensk: 164916.78
  flood_2019_07_amur__konstantinovka: 123544.96
  flood_2019_07_amur__svobodny: 132896.50
  flood_2021_06_amur__blagoveshchensk: 164916.78
  flood_2021_06_amur__konstantinovka: 123544.96
  flood_2021_06_amur__poyarkovo: 109070.60
  flood_2021_08_zeya__svobodny: 129790.03
